<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgCab" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141b2d"/>
      <stop offset="55%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#06080e"/>
    </linearGradient>
    <linearGradient id="neonRim" x1="40" y1="32" x2="472" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff2a3a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#e60012"/>
    </linearGradient>
    <radialGradient id="crtGlow" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#e60012" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldOuter" x1="120" y1="88" x2="380" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="goldInner" x1="150" y1="120" x2="350" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="coinCore" x1="160" y1="130" x2="340" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="ballTop" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ff8a93"/>
      <stop offset="28%" stop-color="#ff1f30"/>
      <stop offset="72%" stop-color="#c8000f"/>
      <stop offset="100%" stop-color="#6b0008"/>
    </radialGradient>
    <linearGradient id="shaftGrad" x1="236" y1="180" x2="268" y2="285" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="marqueeBg" x1="68" y1="366" x2="444" y2="454" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#192236"/>
      <stop offset="50%" stop-color="#0f1523"/>
      <stop offset="100%" stop-color="#1e131c"/>
    </linearGradient>
    <linearGradient id="opxText" x1="270" y1="382" x2="412" y2="436" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff3b4a"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed dark cabinet backdrop so iOS/Android maskable icons never show white corners -->
  <rect width="512" height="512" rx="96" fill="#070a12"/>

  <!-- Outer Rounded App Tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgCab)"/>
  <rect x="24" y="24" width="464" height="464" rx="100" stroke="url(#neonRim)" stroke-width="8" stroke-opacity="0.9"/>
  <rect x="36" y="36" width="440" height="440" rx="90" stroke="#ffffff" stroke-width="2" stroke-opacity="0.08"/>

  <!-- Subtle CRT Ambient Glow & Grid Lines -->
  <circle cx="256" cy="220" r="210" fill="url(#crtGlow)"/>
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="2">
    <line x1="48" y1="96" x2="464" y2="96"/>
    <line x1="48" y1="128" x2="464" y2="128"/>
    <line x1="48" y1="160" x2="464" y2="160"/>
    <line x1="48" y1="192" x2="464" y2="192"/>
    <line x1="48" y1="224" x2="464" y2="224"/>
    <line x1="48" y1="256" x2="464" y2="256"/>
    <line x1="48" y1="288" x2="464" y2="288"/>
    <line x1="48" y1="320" x2="464" y2="320"/>
    <line x1="48" y1="352" x2="464" y2="352"/>
  </g>

  <!-- Top Arcade Coin Slot Portal -->
  <rect x="176" y="48" width="160" height="22" rx="11" fill="#05070c" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.7"/>
  <rect x="192" y="55" width="128" height="8" rx="4" fill="#ff2a3a" filter="url(#neonGlow)"/>

  <!-- 4 MVS Arcade Action Buttons Arc (A-Red, B-Yellow, C-Green, D-Blue) -->
  <g filter="url(#softShadow)">
    <!-- Button A (Red) -->
    <circle cx="82" cy="252" r="24" fill="#1e293b" stroke="#ff2a3a" stroke-width="4"/>
    <circle cx="82" cy="252" r="17" fill="#e60012"/>
    <circle cx="76" cy="246" r="5" fill="#ff9aa2" fill-opacity="0.75"/>

    <!-- Button B (Yellow) -->
    <circle cx="94" cy="182" r="24" fill="#1e293b" stroke="#fde047" stroke-width="4"/>
    <circle cx="94" cy="182" r="17" fill="#eab308"/>
    <circle cx="88" cy="176" r="5" fill="#fef9c3" fill-opacity="0.8"/>

    <!-- Button C (Green) -->
    <circle cx="418" cy="182" r="24" fill="#1e293b" stroke="#34d399" stroke-width="4"/>
    <circle cx="418" cy="182" r="17" fill="#10b981"/>
    <circle cx="412" cy="176" r="5" fill="#a7f3d0" fill-opacity="0.8"/>

    <!-- Button D (Blue) -->
    <circle cx="430" cy="252" r="24" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="430" cy="252" r="17" fill="#0284c7"/>
    <circle cx="424" cy="246" r="5" fill="#bae6fd" fill-opacity="0.8"/>
  </g>

  <!-- Central Golden Arcade Coin Medallion -->
  <g filter="url(#softShadow)">
    <circle cx="256" cy="222" r="130" fill="url(#goldOuter)"/>
    <circle cx="256" cy="222" r="118" fill="none" stroke="#451a03" stroke-width="4" stroke-opacity="0.5"/>
    <circle cx="256" cy="222" r="110" fill="url(#goldInner)"/>
    <!-- Coin Rim Ridges / Notches -->
    <circle cx="256" cy="222" r="102" fill="url(#coinCore)" stroke="#fde047" stroke-width="3" stroke-dasharray="14 8"/>
  </g>

  <!-- Coin Face Details: Vertical Arcade Coin Slot + Stylized "X" Wings -->
  <path d="M184 184 L222 222 L184 260" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>
  <path d="M328 184 L290 222 L328 260" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>

  <!-- Joystick Dust Washer Base at Center of Coin -->
  <ellipse cx="256" cy="272" rx="48" ry="22" fill="#05070c" stroke="#475569" stroke-width="4"/>
  <ellipse cx="256" cy="272" rx="26" ry="11" fill="#1e293b"/>

  <!-- Chrome Joystick Shaft -->
  <rect x="243" y="168" width="26" height="104" rx="13" fill="url(#shaftGrad)" stroke="#0f172a" stroke-width="3"/>

  <!-- Iconic Red Ball-Top Joystick Handle -->
  <g filter="url(#softShadow)">
    <circle cx="256" cy="148" r="52" fill="url(#ballTop)" stroke="#ffd1d6" stroke-width="2" stroke-opacity="0.5"/>
    <!-- Specular Gloss Highlight -->
    <ellipse cx="236" cy="126" rx="18" ry="11" transform="rotate(-24 236 126)" fill="#ffffff" fill-opacity="0.65"/>
    <circle cx="224" cy="144" r="5" fill="#ffffff" fill-opacity="0.4"/>
  </g>

  <!-- Bottom Arcade Marquee Plate: COIN-OPX -->
  <g filter="url(#softShadow)">
    <rect x="56" y="368" width="400" height="84" rx="26" fill="url(#marqueeBg)" stroke="url(#neonRim)" stroke-width="5"/>
    <rect x="64" y="376" width="384" height="68" rx="20" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.12"/>
    <text
      x="256"
      y="425"
      text-anchor="middle"
      font-family="'Chakra Petch', 'Arial Black', Impact, sans-serif"
      font-weight="900"
      font-size="52"
      letter-spacing="3"
    >
      <tspan fill="#ffffff">COIN</tspan><tspan fill="#fbbf24">-</tspan><tspan fill="url(#opxText)">OPX</tspan>
    </text>
  </g>
</svg>
